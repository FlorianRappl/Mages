name: CI

on: [push, pull_request]

env:
  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
  GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VSCE_PAT: ${{ secrets.VSCE_PAT }}

jobs:
  # linux:
  #   runs-on: ubuntu-latest

  #   steps:
  #   - uses: actions/checkout@v2

  #   - uses: actions/setup-dotnet@v3
  #     with:
  #       dotnet-version: |
  #         5.0.x
  #         6.0.x
  #         7.0.x
  #         8.0.x
  #         9.0.x
  #         10.0.x

  #   - name: Build
  #     run: ./build.sh

  windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build & Test VS Code Extension
      run: |
        cd src/vscode-mages
        npm ci
        npm run compile
        npx @vscode/vsce package --no-dependencies

    - name: Publish VS Code Extension
      if: github.ref == 'refs/heads/main' && env.VSCE_PAT != ''
      run: |
        cd src/vscode-mages
        npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }} --no-dependencies

    - name: Build
      run: |
        if ($env:GITHUB_REF -eq "refs/heads/main") {
          .\build.ps1 -Target Publish
        } elseif ($env:GITHUB_REF -eq "refs/heads/devel") {
          .\build.ps1 -Target PrePublish
        } else {
          .\build.ps1
        }
